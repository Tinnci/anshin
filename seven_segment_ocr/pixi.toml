[workspace]
name = "seven-segment-ocr"
version = "0.1.0"
description = "7-segment LCD display digit recognition: synthetic data generation + lightweight model training"
channels = ["conda-forge", "pytorch"]
platforms = ["osx-64"]

[dependencies]
python = ">=3.11"
pillow = ">=10.0"
numpy = ">=1.26"
pytorch = ">=2.2"
torchvision = ">=0.17"
tqdm = ">=4.66"
matplotlib = ">=3.8"
onnxscript = ">=0.5.6,<0.6"
onnx = ">=1.20.0,<2"
onnxruntime = ">=1.22.2,<2"
opencv = ">=4.13.0,<5"
gdown = ">=5.2.1,<6"
kaggle = ">=2.1.2,<3"

[tasks]
generate = "python generate_data.py"
train = "python train.py"
export = "python export_tflite.py"
preview = "python generate_data.py --preview"
domain-adapt = "python kaggle_domain_adaptation_kernel/kaggle_domain_adaptation.py --output-dir domain_adaptation_output --synthetic-samples 2000 --epochs 1"
domain-adapt-tiny = "python kaggle_domain_adaptation_kernel/kaggle_domain_adaptation.py --output-dir domain_adaptation_tiny --synthetic-samples 2000 --epochs 1 --model-variant tiny"
domain-adapt-base = "python kaggle_domain_adaptation_kernel/kaggle_domain_adaptation.py --output-dir domain_adaptation_base --synthetic-samples 2000 --epochs 1 --model-variant base"
domain-adapt-large = "python kaggle_domain_adaptation_kernel/kaggle_domain_adaptation.py --output-dir domain_adaptation_large --synthetic-samples 2000 --epochs 1 --model-variant large"
kaggle-push-domain = "kaggle kernels push -p kaggle_domain_adaptation_kernel --accelerator NvidiaTeslaT4"
kaggle-status-domain = "kaggle kernels status tiiann/seven-segment-ocr-domain-adaptation"
eval-ocr = "python ocr_model_eval.py"
dequantize-onnx = "python dequantize_onnx.py"
export-candidates-plan = "python download_and_export_candidates.py --dry-run"
