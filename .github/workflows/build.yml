name: CI Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Verify generated Room schemas are committed
        run: bash scripts/verify-room-schema.sh

      - name: Verify and build Debug APK
        run: ./gradlew ktlintCheck test lintDebug assembleDebug compileDebugAndroidTestKotlin --build-cache --configuration-cache --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_number }}
          path: "**/build/test-results/"
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  medication-flow:
    name: Medication UI & Room migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Add Android SDK tools to PATH
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install and boot headless API 35 emulator
        run: |
          mkdir -p "$HOME/.android/avd"
          mkdir -p "$HOME/.config/.android"
          ln -sfn "$HOME/.android/avd" "$HOME/.config/.android/avd"
          sdkmanager 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager --silent create avd --name medication-tests --package 'system-images;android-35;google_apis;x86_64' --force
          echo "=== Configured AVDs ==="
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd medication-tests \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -camera-front none \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "Waiting for emulator device..."
          adb wait-for-device
          echo "Waiting for system boot completed..."
          # The inner shell evaluates the boot property on each iteration.
          # shellcheck disable=SC2016
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
      - name: Test daily medication flow and migrations
        run: bash scripts/test-medication-flow.sh
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medication-flow-results-${{ github.run_number }}
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
            ${{ runner.temp }}/emulator.log
          retention-days: 7
      - name: Stop emulator
        if: always()
        run: adb emu kill || true

  dependency-graph:
    name: Submit resolved dependencies
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
      - name: Submit Gradle dependency graph for security alerts
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache
