name: Release

# Triggered by pushing a semantic version tag, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
# Pre-release tags (containing '-') are published as GitHub pre-releases:
#   v1.2.0-rc1, v1.2.0-beta2, v1.2.0-alpha1
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. 拉取完整历史（用于生成 CHANGELOG） ─────────────────
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main ancestry / 验证标签与 main 祖先关系
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag / 不支持的发布标签: $GITHUB_REF_NAME"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in origin/main. / 发布标签必须指向 origin/main 中的提交。"
            exit 1
          fi

      # ── 2. 配置 JDK ───────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success
          cache-read-only: true

      # ── 3. 从 tag 解析版本号 ──────────────────────────────────
      - name: Extract version from tag / 从标签提取版本
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"

          if [[ ! "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)([0-9]+))?$ ]]; then
            echo "::error::Cannot parse release version / 无法解析发布版本: $TAG"
            exit 1
          fi

          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          CHANNEL="${BASH_REMATCH[5]:-stable}"
          COUNTER="${BASH_REMATCH[6]:-0}"

          if (( MAJOR > 209 || MINOR > 99 || PATCH > 999 )); then
            echo "::error::Version exceeds supported range (major <= 209, minor <= 99, patch <= 999). / 版本超出支持范围。"
            exit 1
          fi

          case "$CHANNEL" in
            stable)
              STAGE=99
              ;;
            alpha)
              COUNTER=$((10#$COUNTER))
              (( COUNTER >= 1 && COUNTER <= 19 )) || {
                echo "::error::Pre-release counter must be 1..19. / 预发布序号必须为 1..19。"
                exit 1
              }
              STAGE=$COUNTER
              ;;
            beta)
              COUNTER=$((10#$COUNTER))
              (( COUNTER >= 1 && COUNTER <= 19 )) || {
                echo "::error::Pre-release counter must be 1..19. / 预发布序号必须为 1..19。"
                exit 1
              }
              STAGE=$((20 + COUNTER))
              ;;
            rc)
              COUNTER=$((10#$COUNTER))
              (( COUNTER >= 1 && COUNTER <= 19 )) || {
                echo "::error::Pre-release counter must be 1..19. / 预发布序号必须为 1..19。"
                exit 1
              }
              STAGE=$((40 + COUNTER))
              ;;
          esac

          # Monotonic across alpha → beta → rc → stable and the next patch.
          VERSION_CODE=$((MAJOR * 10000000 + MINOR * 100000 + PATCH * 100 + STAGE))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          {
            echo "## Release version / 发布版本"
            echo
            echo "| Field / 字段 | Value / 值 |"
            echo "|---|---|"
            echo "| versionName | \`$TAG\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| Channel / 渠道 | \`$CHANNEL\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. 最终验证并构建 Release APK ─────────────────────────
      - name: Verify generated Room schemas / 验证 Room 生成结构
        run: bash scripts/verify-room-schema.sh

      - name: Verify release sources / 验证发布代码
        run: ./gradlew ktlintCheck test lintDebug compileDebugAndroidTestKotlin --build-cache --configuration-cache --stacktrace

      # ── 4. 验证并解码 Release Keystore ─────────────────────────
      - name: Validate and decode keystore / 验证并解码密钥库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing release secrets / 缺少发布密钥: ${missing[*]}"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK / 构建签名发布 APK
        run: ./gradlew assembleRelease -PenableAbiSplits=true --build-cache --configuration-cache --stacktrace
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 6. 重命名 APK（按 ABI split 分别命名）─────────────────
      - name: Rename APKs / 重命名 APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          VER="${{ steps.version.outputs.version_name }}"
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          if [ "${#APKS[@]}" -ne 3 ]; then
            echo "::error::Expected three ABI APKs, found ${#APKS[@]}. / 应生成三个 ABI APK。"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            BASENAME=$(basename "$apk" .apk)
            # 识别 ABI：universal / arm64-v8a / armeabi-v7a
            case "$BASENAME" in
              *universal*) ABI="universal" ;;
              *arm64*)     ABI="arm64-v8a" ;;
              *armeabi*)   ABI="armeabi-v7a" ;;
              *)
                echo "::error::Unknown APK variant / 未知 APK 变体: $BASENAME"
                exit 1
                ;;
            esac
            NEW_NAME="Anshin-v${VER}-${ABI}.apk"
            mv "$apk" "$APK_DIR/$NEW_NAME"
            echo "  → $NEW_NAME ($(du -h "$APK_DIR/$NEW_NAME" | cut -f1))"
          done

      # ── 7. 验证签名并生成校验和 ────────────────────────────────
      - name: Verify signatures and checksums / 验证签名与校验和
        run: |
          APK_DIR="app/build/outputs/apk/release"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK. / Android SDK 中未找到 apksigner。"
            exit 1
          fi

          for apk in "$APK_DIR"/Anshin-*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          (
            cd "$APK_DIR"
            sha256sum Anshin-*.apk > SHA256SUMS
          )

      - name: Attest release APK provenance / 证明发布 APK 构建来源
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "app/build/outputs/apk/release/Anshin-*.apk"

      # ── 8. 生成 CHANGELOG（自上一个 tag 以来的提交） ─────────
      - name: Generate changelog / 生成变更记录
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" \
            --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [ -z "$LOG" ]; then
            LOG="- Maintenance release / 维护版本"
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 9. 发布 GitHub Release，附带 APK ─────────────────────
      - name: Create GitHub Release / 创建 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Anshin v${{ steps.version.outputs.version_name }}"
          body: |
            ## 更新内容 / What's changed

            ${{ steps.changelog.outputs.changelog }}

            ---
            ## 下载 / Downloads

            | APK 变体 / Variant | 适用设备 / Devices | 说明 / Notes |
            |---|---|---|
            | `arm64-v8a` | 绝大多数现代手机 / Most modern phones | 推荐，体积最小 / Recommended, smallest |
            | `armeabi-v7a` | 旧款 32 位 ARM 设备 / Older 32-bit ARM devices | 兼容性回退 / Compatibility fallback |
            | `universal` | 所有 ARM 设备 / All ARM devices | 包含全部架构 / Includes all ABIs |

            ---
            ## 构建信息 / Build information

            | 项目 / Field | 值 / Value |
            |---|---|
            | versionName | `${{ steps.version.outputs.version_name }}` |
            | versionCode | `${{ steps.version.outputs.version_code }}` |
            | 渠道 / Channel | `${{ steps.version.outputs.channel }}` |
            | 构建号 / Run | `#${{ github.run_number }}` |
            | Commit | ${{ github.sha }} |
            | 签名 / Signature | ✅ 已签名并通过 `apksigner` 验证 / Signed and verified |

            每个 APK 均列入 `SHA256SUMS`，并具有 GitHub 构建来源证明。可使用
            `gh attestation verify <apk> --repo Tinnci/anshin` 验证。

            Every APK is listed in `SHA256SUMS` and has a GitHub build provenance
            attestation. Verify it with
            `gh attestation verify <apk> --repo Tinnci/anshin`.
          files: |
            app/build/outputs/apk/release/Anshin-*.apk
            app/build/outputs/apk/release/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

      - name: Remove signing material / 清理签名文件
        if: always()
        run: rm -f keystore.jks

      - name: Upload validation reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ github.run_number }}
          path: |
            **/build/test-results/
            **/build/reports/lint-results-debug.*
          retention-days: 7
