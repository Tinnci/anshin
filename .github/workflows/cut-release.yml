name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (or custom)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom semver without 'v' (e.g. 1.27.0 or 1.27.0-rc1, used when bump=custom)"
        required: false
        default: ""
        type: string
      require_ci:
        description: "Require CI Build to pass on main HEAD before tagging"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    name: Tag & Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify CI Build passed on main HEAD
        if: ${{ inputs.require_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCL=$(gh run list \
            --workflow=build.yml \
            --commit="$GITHUB_SHA" \
            --status=completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // ""')
          if [ "$CONCL" != "success" ]; then
            echo "::error::CI Build has not succeeded for $GITHUB_SHA (conclusion='$CONCL'). Wait for CI Build or disable require_ci."
            exit 1
          fi

      - name: Compute, tag, and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.bump }}" = "custom" ]; then
            RAW="${{ inputs.custom_version }}"
            RAW="${RAW#v}"
            if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$ ]]; then
              echo "::error::Invalid custom_version '$RAW'. Expected X.Y.Z or X.Y.Z-(alpha|beta|rc)N."
              exit 1
            fi
            NEW_TAG="v$RAW"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v0.0.0")
            BASE="${LATEST_TAG#v}"
            BASE="${BASE%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $NEW_TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Created and pushed tag $NEW_TAG"

          gh workflow run release.yml --ref "$NEW_TAG"
          echo "Triggered release.yml for $NEW_TAG"
